name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc:
    name: MSVC x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build GUI application
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE
          src\gui\FolderSizeTool.cpp src\common\FolderScanner.cpp
          /link /SUBSYSTEM:WINDOWS comctl32.lib shell32.lib ole32.lib
          comdlg32.lib user32.lib /OUT:fs-gui.exe

      - name: Build CLI application
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /O2 /EHsc /DUNICODE /D_UNICODE
          src\cli\fs.cpp src\common\FolderScanner.cpp
          /link /SUBSYSTEM:CONSOLE /OUT:fs.exe

      - name: Upload GUI executable
        uses: actions/upload-artifact@v7
        with:
          name: fs-gui-MSVC-x64
          path: fs-gui.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI executable
        uses: actions/upload-artifact@v7
        with:
          name: fs-MSVC-x64
          path: fs.exe
          if-no-files-found: error
          retention-days: 7

  mingw:
    name: MinGW-w64 UCRT64 Build
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Show compiler version
        run: g++ --version

      - name: Build GUI application
        run: >-
          g++ -std=c++17 -O2 -municode -mwindows
          -static -static-libgcc -static-libstdc++
          src/gui/FolderSizeTool.cpp src/common/FolderScanner.cpp
          -o fs-gui.exe
          -lcomctl32 -lshell32 -lole32 -lcomdlg32 -luser32 -luuid

      - name: Build CLI application
        run: >-
          g++ -std=c++17 -O2 -municode -mconsole
          -static -static-libgcc -static-libstdc++
          src/cli/fs.cpp src/common/FolderScanner.cpp
          -o fs.exe

      - name: Upload GUI executable
        uses: actions/upload-artifact@v7
        with:
          name: fs-gui-MinGW-UCRT64
          path: fs-gui.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload CLI executable
        uses: actions/upload-artifact@v7
        with:
          name: fs-MinGW-UCRT64
          path: fs.exe
          if-no-files-found: error
          retention-days: 7
